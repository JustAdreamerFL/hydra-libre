name: Checks

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      # Checks do not need the platform Ludusavi binary or Python RPC. Skipping
      # install scripts makes this job deterministic and keeps it independent
      # from optional runtime assets.
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: yarn typecheck

      - name: Run tests
        run: yarn test
